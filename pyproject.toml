[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "skolemelding-connector"
version = "0.1.0"
description = "Browser-independent Skolemelding guardian connector with mobile refresh tokens"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "mcp>=1.2,<2", "pypdf>=5,<7"]

[project.optional-dependencies]
login = ["playwright>=1.49,<2"]
dev = ["ruff>=0.11"]

[project.scripts]
skolemelding = "skolemelding_connector.cli:main"
skolemelding-mcp = "skolemelding_connector.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/skolemelding_connector"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
